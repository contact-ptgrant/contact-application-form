<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Information | PT-Grant</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #312e81 100%);
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before, body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: 0;
        }

        body::before {
            background: #4f46e5;
            top: -50px;
            left: -50px;
        }

        body::after {
            background: #06b6d4;
            bottom: -50px;
            right: -50px;
        }

        .container {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            padding: 40px 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
            border-radius: 16px;
            margin-bottom: 12px;
            box-shadow: 0 8px 16px rgba(79, 70, 229, 0.3);
            letter-spacing: -1px;
        }

        .header h1 {
            color: #0f172a;
            font-size: 24px;
            font-weight: 700;
        }

        .header p {
            color: #64748b;
            font-size: 14px;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="tel"],
        input[type="email"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            background-color: #f8fafc;
        }

        input:focus {
            border-color: #4f46e5;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .radio-group {
            display: flex;
            gap: 15px;
            margin-top: 8px;
        }

        .radio-option {
            flex: 1;
        }

        .radio-option input[type="radio"] {
            display: none;
        }

        .radio-label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #475569;
            transition: all 0.2s ease;
            background-color: #f8fafc;
        }

        .radio-option input[type="radio"]:checked + .radio-label {
            border-color: #4f46e5;
            color: #4f46e5;
            font-weight: 600;
            background-color: #eef2ff;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .success-card {
            display: none;
            text-align: center;
            padding: 10px 0;
            animation: fadeIn 0.4s ease-in-out forwards;
        }

        .success-icon {
            width: 60px;
            height: 60px;
            background: #dcfce7;
            color: #16a34a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: 0 auto 20px;
        }

        .success-card h2 {
            color: #0f172a;
            font-size: 22px;
            margin-bottom: 15px;
        }

        .notice-box {
            background-color: #f1f5f9;
            border-left: 4px solid #4f46e5;
            padding: 15px;
            border-radius: 8px;
            text-align: left;
            margin-bottom: 20px;
        }

        .notice-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 10px;
            font-size: 14px;
            color: #334155;
        }

        .notice-item:last-child {
            margin-bottom: 0;
        }

        .notice-item span {
            margin-right: 10px;
            font-size: 16px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo-container">PT</div>
            <h1>PT-Grant</h1>
            <p>Please enter your contact details below</p>
        </div>

        <form id="contactForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="firstName" placeholder="John" required>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="lastName" placeholder="Doe" required>
                </div>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="(555) 000-0000" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="john.doe@example.com" required>
            </div>

            <div class="form-group">
                <label>How do you prefer to be connected?</label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="prefEmail" name="preference" value="Email" checked>
                        <label for="prefEmail" class="radio-label">Email</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="prefPhone" name="preference" value="Phone Number">
                        <label for="prefPhone" class="radio-label">Phone Number</label>
                    </div>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">Submit Information</button>
        </form>

        <div id="successCard" class="success-card">
            <div class="success-icon">✓</div>
            <h2>Submission Received!</h2>
            
            <div class="notice-box">
                <div class="notice-item">
                    <span>📧</span>
                    <div>Please check your <strong>email address</strong> (including your <strong>junk or spam</strong> folder).</div>
                </div>
                <div class="notice-item" style="margin-top: 12px;">
                    <span>📱</span>
                    <div>Please check your <strong>phone number</strong> for any incoming messages.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = 'Submitting...';
            submitBtn.disabled = true;

            const payload = {
                firstName: document.getElementById('firstName').value.trim(),
                lastName: document.getElementById('lastName').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                email: document.getElementById('email').value.trim(),
                preference: document.querySelector('input[name="preference"]:checked').value
            };

            fetch('/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('contactForm').style.display = 'none';
                document.getElementById('successCard').style.display = 'block';
            })
            .catch(err => {
                alert('Submission failed. Please try again.');
                submitBtn.innerText = 'Submit Information';
                submitBtn.disabled = false;
            });
        });
    </script>

</body>
</html>
